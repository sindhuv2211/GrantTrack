<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>GrantTrack – Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<nav class="navbar">
    <a class="brand" th:href="@{/}">&#128218; GrantTrack</a>
    <a th:href="@{/}">Dashboard</a>
    <a th:href="@{/applications}">Applications</a>
    <a th:href="@{/faculty}">Faculty</a>
    <a th:href="@{/applications/new}" class="btn-light">+ New Application</a>
</nav>

<div class="container">

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}"   class="alert alert-error"   th:text="${error}"></div>

    <div class="page-header">
        <h2>Dashboard</h2>
    </div>

    <div class="stats">
        <div class="stat-card">
            <div class="stat-number c-blue"   th:text="${total}">0</div>
            <div class="stat-label">Total</div>
        </div>
        <div class="stat-card">
            <div class="stat-number c-gray"   th:text="${submitted}">0</div>
            <div class="stat-label">Submitted</div>
        </div>
        <div class="stat-card">
            <div class="stat-number c-yellow" th:text="${underReview}">0</div>
            <div class="stat-label">Under Review</div>
        </div>
        <div class="stat-card">
            <div class="stat-number c-green"  th:text="${approved}">0</div>
            <div class="stat-label">Approved</div>
        </div>
        <div class="stat-card">
            <div class="stat-number c-red"    th:text="${rejected}">0</div>
            <div class="stat-label">Rejected</div>
        </div>
        <div class="stat-card">
            <div class="stat-number c-red"    th:text="${nearDeadline}">0</div>
            <div class="stat-label">Near Deadline</div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">All Applications</div>
        <div class="card-body" style="padding:0">
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th><th>Title</th><th>Faculty</th>
                            <th>Requested (&#8377;)</th><th>Deadline</th><th>Status</th><th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(apps)}">
                            <td colspan="7" style="text-align:center;color:#888;padding:24px">No applications found.</td>
                        </tr>
                        <tr th:each="app : ${apps}">
                            <td th:text="${app.id}"></td>
                            <td th:text="${app.title}"></td>
                            <td th:text="${app.faculty != null ? app.faculty.name : '–'}"></td>
                            <td th:text="${#numbers.formatDecimal(app.requestedAmount, 1, 'COMMA', 2, 'POINT')}"></td>
                            <td th:text="${app.deadline}"></td>
                            <td>
                                <span th:class="'badge badge-' + ${#strings.toLowerCase(app.status.name())}"
                                      th:text="${app.status}"></span>
                            </td>
                            <td>
                                <a th:href="@{/applications/{id}(id=${app.id})}" class="btn btn-primary btn-sm">View</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>
</body>
</html>
