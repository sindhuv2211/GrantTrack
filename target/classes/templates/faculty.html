<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>GrantTrack – Faculty</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<nav class="navbar">
    <a class="brand" th:href="@{/}">&#128218; GrantTrack</a>
    <a th:href="@{/}">Dashboard</a>
    <a th:href="@{/applications}">Applications</a>
    <a th:href="@{/faculty}">Faculty</a>
    <a th:href="@{/applications/new}" class="btn-light">+ New Application</a>
</nav>

<div class="container">

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}"   class="alert alert-error"   th:text="${error}"></div>

    <div class="page-header">
        <h2>Faculty Management</h2>
    </div>

    <div style="display:grid;grid-template-columns:360px 1fr;gap:24px">

        <!-- Add faculty form -->
        <div class="card" style="align-self:start">
            <div class="card-header">Add Faculty</div>
            <div class="card-body">
                <form th:action="@{/faculty/new}" method="post">
                    <div class="form-group">
                        <label>Name <span class="required">*</span></label>
                        <input type="text" name="name" required placeholder="e.g. Dr. Arun Kumar"/>
                    </div>
                    <div class="form-group">
                        <label>Email <span class="required">*</span></label>
                        <input type="email" name="email" required placeholder="e.g. arun@example.com"/>
                    </div>
                    <div class="form-group">
                        <label>Department <span class="required">*</span></label>
                        <input type="text" name="department" required placeholder="e.g. Computer Science"/>
                    </div>
                    <button type="submit" class="btn btn-primary">Add Faculty</button>
                </form>
            </div>
        </div>

        <!-- Faculty list -->
        <div class="card">
            <div class="card-header">Faculty List</div>
            <div class="card-body" style="padding:0">
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr><th>ID</th><th>Name</th><th>Email</th><th>Department</th></tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(faculties)}">
                                <td colspan="4" style="text-align:center;color:#888;padding:24px">No faculty found.</td>
                            </tr>
                            <tr th:each="f : ${faculties}">
                                <td th:text="${f.id}"></td>
                                <td th:text="${f.name}"></td>
                                <td th:text="${f.email}"></td>
                                <td th:text="${f.department}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
</div>
</body>
</html>
