<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>GrantTrack – New Application</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<nav class="navbar">
    <a class="brand" th:href="@{/}">&#128218; GrantTrack</a>
    <a th:href="@{/}">Dashboard</a>
    <a th:href="@{/applications}">Applications</a>
    <a th:href="@{/faculty}">Faculty</a>
    <a th:href="@{/applications/new}" class="btn-light">+ New Application</a>
</nav>

<div class="container">

    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <div class="page-header">
        <h2>Submit New Application</h2>
        <a th:href="@{/applications}" class="btn btn-outline">&#8592; Back</a>
    </div>

    <div class="card" style="max-width:680px">
        <div class="card-header">Application Details</div>
        <div class="card-body">
            <form th:action="@{/applications/new}" method="post">

                <div class="form-group">
                    <label>Faculty <span class="required">*</span></label>
                    <select name="facultyId" required>
                        <option value="">Select faculty...</option>
                        <option th:each="f : ${faculties}"
                                th:value="${f.id}"
                                th:text="${f.name + ' – ' + f.department}"></option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Title <span class="required">*</span></label>
                    <input type="text" name="title" required placeholder="e.g. AI-Based Drug Discovery"/>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label>Requested Amount (&#8377;) <span class="required">*</span></label>
                        <input type="number" name="requestedAmount" required min="1" step="0.01" placeholder="e.g. 500000"/>
                    </div>
                    <div class="form-group">
                        <label>Approved Amount (&#8377;)</label>
                        <input type="number" name="approvedAmount" min="0" step="0.01" placeholder="Optional"/>
                        <div class="form-hint">Leave blank to default to 0. Can be set on approval.</div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Deadline <span class="required">*</span></label>
                    <input type="date" name="deadline" required/>
                </div>

                <div class="form-group">
                    <label>Abstract <span class="required">*</span></label>
                    <textarea name="abstractText" required placeholder="Describe the research project..."></textarea>
                </div>

                <div class="form-group">
                    <label>Status</label>
                    <input type="text" value="SUBMITTED" readonly style="background:#f8f9fa;color:#888"/>
                    <div class="form-hint">Automatically set to SUBMITTED on creation.</div>
                </div>

                <div style="display:flex;gap:10px;margin-top:8px">
                    <button type="submit" class="btn btn-primary">Submit Application</button>
                    <a th:href="@{/applications}" class="btn btn-outline">Cancel</a>
                </div>
            </form>
        </div>
    </div>

</div>
</body>
</html>
